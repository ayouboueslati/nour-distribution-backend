name: CI

on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-findings
        path: bandit-report.json
        
  dependency_scan:
    name: Run Safety Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pip-audit on requirements.txt
        run: |
          pip install pip-audit
          pip-audit -r requirements/base.txt -f json -o pip-audit-report.json -v || true
      
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  code_quality:
    name: Run Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Linting Tools
      run: pip install flake8
    - name: Run Flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    
  image_scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
       
    - name: Build Docker Image
      run: docker build -t nour-backend:${{ github.sha }} .

    - name: Install Docker Scout CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
        chmod +x install-scout.sh
        ./install-scout.sh

    - name: Authenticate to Docker Hub
      run: echo "${{ secrets.REPO_PWD }}" | docker login -u "${{ secrets.REPO_USER }}" --password-stdin

    - name: Generate Docker Scout Reports
      run: |
        # Clear any corrupt cache left by the failed action
        rm -rf /tmp/docker-scout* 2>/dev/null || true
        # 1. Create a readable text overview
        docker scout quickview nour-backend:${{ github.sha }} > scout-quickview.txt
        # 2. Create a detailed JSON report for GitHub Security tab
        docker scout cves nour-backend:${{ github.sha }} --format sarif -o scout-cves.sarif.json
        
    - name: Upload Docker Scout Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-reports
        path: |
          scout-quickview.txt
          scout-cves.sarif.json
