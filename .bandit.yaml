# Bandit Security Scan Configuration
# This file configures Bandit SAST tool for the NOUR Distribution Backend

# Exclude directories from scanning
exclude_dirs:
  - /tests/
  - /venv/
  - /.venv/
  - /migrations/
  - /__pycache__/

# Tests to skip (we've fixed all critical issues, but these are acceptable)
# Using empty list to run all tests
skips: []

# List of plugins to load
# Empty means load all plugins
plugins: []

# Confidence level filter
# Options: LOW, MEDIUM, HIGH
# We filter out LOW confidence issues to reduce false positives
confidence: MEDIUM

# Severity level filter  
# Options: LOW, MEDIUM, HIGH
# We want to catch all MEDIUM and HIGH severity issues
severity: LOW
